spec: mmt8.song.edit-and-play
title: In SONG mode, EDIT builds a list of parts; PLAY plays the steps in order
device: mmt8
tags: [song, edit, play]
description: >
  Manual 8 and 9.3: with SONG mode on, EDIT shows EDIT SONG nn / STEP 01
  PART; the keypad enters the part for the step, >> moves to the next step.
  Turning EDIT off returns to the select song display (the song is now named
  NO SONG NAME). PLAY shows the song, step and beat, plays each step's part
  in turn (the 2-beat fixture part twice, so its note twice) and stops at
  the end.
provenance:
  status: verified
  verified:
    - {device: mmt8, firmware: "1.11", date: 2026-09-24, method: firmware-emulator}
  source: MMT-8 Instruction Manual, sections 8 and 9.3

given: recorded-part

steps:
  - press: song
  - wait: 100ms
  - expect: {lcd.line1: SELECT SONG 00, led.song: true}
  - press: edit
  - wait: 100ms
  - expect: {lcd.line1: EDIT SONG 00, lcd.line2: STEP 01  PART, led.edit: true}
  - press: digit0
  - press: digit0
  - wait: 100ms
  - expect: {lcd.line2: STEP 01  PART 00}
  - press: ff
  - wait: 100ms
  - expect: {lcd.line2: STEP 02  PART}
  - press: digit0
  - press: digit0
  - wait: 100ms
  - expect: {lcd.line2: STEP 02  PART 00}
  - press: edit
  - wait: 100ms
  - expect: {lcd.line1: SELECT SONG 00, lcd.line2: '" NO SONG NAME "', led.edit: false}
  - press: play
  - wait: 300ms
  - expect: {lcd.line1: SONG 00 STEP 001, lcd.line2: PART 00 BEAT 001, led.play: true}
  - wait: 1s
  - expect: {lcd.line1: SONG 00 STEP 002}
  - wait: 1200ms
  - expect: {lcd.line1: SELECT SONG 00, led.play: false}
  - expect_events:
      contains:
        - {type: midi, status: start}
        - {type: midi, status: note_on, note: 60}
        - {type: midi, status: note_on, note: 60}
        - {type: midi, status: stop}
